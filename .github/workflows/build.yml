          cat > app/src/main/java/com/example/floatai/FloatingService.kt << 'EOF'
          package com.example.floatai

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.Base64
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.AnimationUtils
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class FloatingService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var bubbleView: View
              private var answerView: View? = null
              private var menuView: View? = null
              private var loadingView: View? = null
              private var scanView: View? = null
              
              private var API_KEY = ""
              private var isHidden = false
              private var lastAnswer = ""
              private var isNotifEnabled = false
              private var lastClipboardText = ""
              
              private var featJawab = true
              private var featPenjelasan = true
              private var featEsai = true
              private var featScan = true
              private var featAutoCopy = true

              private var scanRect: Rect? = null
              private var currentMode = ""
              private var cooldownEndTime = 0L
              private var cooldownHandler = Handler(Looper.getMainLooper())
              private var cooldownRunnable: Runnable? = null

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              
              // Handler Animasi Progress
              private val progressHandler = Handler(Looper.getMainLooper())
              private var currentProgress = 0
              private var progressRunnable: Runnable? = null

              private val clipboardListener = ClipboardManager.OnPrimaryClipChangedListener {
                  if (isNotifEnabled) {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = clipboard.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val text = clip.getItemAt(0).text?.toString() ?: ""
                          if (text.isNotBlank() && text != lastClipboardText && text != lastAnswer) {
                              lastClipboardText = text
                              askAIWithText(text, "PENJELASAN")
                          }
                      }
                  }
              }

              private val notificationActionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "COPY_ALL_ANSWER" -> if (lastAnswer.isNotEmpty()) {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("Belajar", lastAnswer))
                              Toast.makeText(this@FloatingService, "Tersalin!", Toast.LENGTH_SHORT).show()
                          }
                          "COPY_JUST_ANSWER" -> if (lastAnswer.isNotEmpty()) {
                              val ans = extractAnswerOnly(lastAnswer)
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("Belajar", ans))
                              Toast.makeText(this@FloatingService, "Jawaban disalin!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private val stopReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) { cleanupAndStop() }
              }

              private val projectionCallback = object : MediaProjection.Callback() {
                  override fun onStop() { releaseProjection() }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  API_KEY = prefs.getString("api_key", "") ?: ""
                  featJawab = prefs.getBoolean("feat_jawab", true)
                  featPenjelasan = prefs.getBoolean("feat_penjelasan", true)
                  featEsai = prefs.getBoolean("feat_esai", true)
                  featScan = prefs.getBoolean("feat_scan", true)
                  featAutoCopy = prefs.getBoolean("feat_autocopy", true)

                  registerReceivers()
                  startForegroundNotification()
                  showBubble()
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.addPrimaryClipChangedListener(clipboardListener)
              }

              private fun registerReceivers() {
                  val filterStop = IntentFilter("STOP_ROBOT")
                  val filterNotif = IntentFilter().apply {
                      addAction("COPY_ALL_ANSWER")
                      addAction("COPY_JUST_ANSWER")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(stopReceiver, filterStop, RECEIVER_NOT_EXPORTED)
                      registerReceiver(notificationActionReceiver, filterNotif, RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(stopReceiver, filterStop)
                      registerReceiver(notificationActionReceiver, filterNotif)
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "float_ai_service"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Service Belajar", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val intentOpen = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntentOpen = PendingIntent.getActivity(this, 0, intentOpen, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val builder: Notification.Builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, channelId) else Notification.Builder(this)
                  val notif: Notification = builder
                      .setContentTitle("Asisten Belajar").setContentText("Siap membantu. Klik untuk buka app.")
                      .setSmallIcon(R.drawable.ic_notification).setContentIntent(pendingIntentOpen).setOngoing(true).build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else startForeground(1, notif)
              }

              private fun showResultNotification(answerText: String) {
                  val channelId = "hasil_ai_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Hasil Jawaban AI", NotificationManager.IMPORTANCE_HIGH)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val intentCopyAll = Intent("COPY_ALL_ANSWER")
                  val pendingCopyAll = PendingIntent.getBroadcast(this, 10, intentCopyAll, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val intentCopyJust = Intent("COPY_JUST_ANSWER")
                  val pendingCopyJust = PendingIntent.getBroadcast(this, 11, intentCopyJust, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val builder = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(R.drawable.ic_notification).setContentTitle("Nesia AI — Ketuk Salin")
                      .setContentText(answerText).setStyle(NotificationCompat.BigTextStyle().bigText(answerText))
                      .setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true)
                      .addAction(0, "Salin Semua", pendingCopyAll).addAction(0, "Salin Jawaban", pendingCopyJust)
                  getSystemService(NotificationManager::class.java).notify(3, builder.build())
              }

              private fun cleanupAndStop() {
                  closeMenu(); closeScan(); closeAnswer(); hideLoadingView()
                  if (::bubbleView.isInitialized) try { windowManager.removeView(bubbleView) } catch (_: Exception) {}
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.removePrimaryClipChangedListener(clipboardListener)
                  releaseProjection()
                  stopSelf()
              }

              private fun releaseProjection() {
                  try { virtualDisplay?.release() } catch (_: Exception) {}
                  virtualDisplay = null
                  try { imageReader?.close() } catch (_: Exception) {}
                  imageReader = null
                  try { mediaProjection?.stop() } catch (_: Exception) {}
                  mediaProjection = null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(stopReceiver) } catch (_: Exception) {}
                  try { unregisterReceiver(notificationActionReceiver) } catch (_: Exception) {}
                  releaseProjection()
                  cooldownRunnable?.let { cooldownHandler.removeCallbacks(it) }
                  progressRunnable?.let { progressHandler.removeCallbacks(it) }
              }

              private fun showBubble() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  bubbleView = LayoutInflater.from(this).inflate(R.layout.floating_bubble, null)
                  val params = WindowManager.LayoutParams(
                      150, 150, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 100; params.y = 300

                  val floatAnim = AnimationUtils.loadAnimation(this, R.anim.floating_anim)
                  bubbleView.startAnimation(floatAnim)

                  bubbleView.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x; initialY = params.y
                                  touchX = event.rawX; touchY = event.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - touchX).toInt()
                                  params.y = initialY + (event.rawY - touchY).toInt()
                                  try { windowManager.updateViewLayout(bubbleView, params) } catch (_: Exception) {}
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  var clickCount = 0; var lastClickTime = 0L
                  bubbleView.setOnClickListener {
                      val currentTime = System.currentTimeMillis()
                      if (currentTime - lastClickTime < 400) clickCount++ else clickCount = 1
                      lastClickTime = currentTime
                      Handler(Looper.getMainLooper()).postDelayed({
                          if (System.currentTimeMillis() - lastClickTime >= 400) {
                              when (clickCount) {
                                  1 -> {
                                      if (isHidden) { isHidden = false; bubbleView.alpha = 1.0f } else showMenu()
                                  }
                                  4 -> { Toast.makeText(this@FloatingService, "Asisten dimatikan!", Toast.LENGTH_SHORT).show(); cleanupAndStop() }
                              }
                              clickCount = 0
                          }
                      }, 400)
                  }
                  windowManager.addView(bubbleView, params)
              }

              private fun showMenu() {
                  if (menuView != null) return
                  menuView = LayoutInflater.from(this).inflate(R.layout.floating_menu, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.CENTER

                  menuView!!.findViewById<ImageView>(R.id.btnCloseMenuX).setOnClickListener { closeMenu() }

                  val header = menuView!!.findViewById<LinearLayout>(R.id.menuHeader)
                  header.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x; initialY = params.y
                                  touchX = event.rawX; touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - touchX).toInt()
                                  params.y = initialY + (event.rawY - touchY).toInt()
                                  try { windowManager.updateViewLayout(menuView, params) } catch (_: Exception) {}
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  val switchNotif = menuView!!.findViewById<Switch>(R.id.switchNotifJawaban)
                  switchNotif.isChecked = isNotifEnabled
                  switchNotif.setOnCheckedChangeListener { _, isChecked ->
                      isNotifEnabled = isChecked
                      Toast.makeText(this, if(isChecked) "Notif Aktif" else "Notif Mati", Toast.LENGTH_SHORT).show()
                  }

                  menuView!!.findViewById<LinearLayout>(R.id.menuScan).setOnClickListener { closeMenu(); openScanScreen("JAWAB") }
                  menuView!!.findViewById<LinearLayout>(R.id.menuJawab).setOnClickListener { closeMenu(); checkCooldownAndProceed("JAWAB") }
                  menuView!!.findViewById<LinearLayout>(R.id.menuPenjelasan).setOnClickListener { closeMenu(); checkCooldownAndProceed("PENJELASAN") }
                  menuView!!.findViewById<LinearLayout>(R.id.menuEsai).setOnClickListener { closeMenu(); checkCooldownAndProceed("ESAI") }

                  val switchSamaran = menuView!!.findViewById<Switch>(R.id.switchSamaran)
                  switchSamaran.isChecked = isHidden
                  switchSamaran.setOnCheckedChangeListener { _, isChecked ->
                      isHidden = isChecked
                      bubbleView.alpha = if (isHidden) 0.01f else 1.0f
                  }
                  windowManager.addView(menuView, params)
              }

              private fun closeMenu() {
                  if (menuView != null) { try { windowManager.removeView(menuView) } catch (_: Exception) {}; menuView = null }
              }

              private fun closeAnswer() {
                  if (answerView != null) { try { windowManager.removeView(answerView) } catch (_: Exception) {}; answerView = null }
              }

              private fun openScanScreen(mode: String) {
                  currentMode = mode
                  if (scanView != null) return
                  scanView = LayoutInflater.from(this).inflate(R.layout.floating_scan, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  windowManager.addView(scanView, params)

                  val scanBox = scanView!!.findViewById<FrameLayout>(R.id.scanBox)
                  val resizeHandle = scanView!!.findViewById<android.widget.ImageView>(R.id.resizeHandle)
                  val btnDoScan = scanView!!.findViewById<Button>(R.id.btnDoScan)
                  val btnCancel = scanView!!.findViewById<Button>(R.id.btnCancelScan)

                  scanBox.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          val boxParams = scanBox.layoutParams as FrameLayout.LayoutParams
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = boxParams.leftMargin; initialY = boxParams.topMargin
                                  touchX = event.rawX; touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  boxParams.leftMargin = initialX + (event.rawX - touchX).toInt()
                                  boxParams.topMargin = initialY + (event.rawY - touchY).toInt()
                                  scanBox.layoutParams = boxParams
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  resizeHandle.setOnTouchListener(object : View.OnTouchListener {
                      var initialWidth = 0; var initialHeight = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          val boxParams = scanBox.layoutParams as FrameLayout.LayoutParams
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialWidth = boxParams.width; initialHeight = boxParams.height
                                  touchX = event.rawX; touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  boxParams.width = (initialWidth + (event.rawX - touchX).toInt()).coerceAtLeast(100)
                                  boxParams.height = (initialHeight + (event.rawY - touchY).toInt()).coerceAtLeast(100)
                                  scanBox.layoutParams = boxParams
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  btnCancel.setOnClickListener { closeScan() }
                  btnDoScan.setOnClickListener {
                      val location = IntArray(2)
                      scanBox.getLocationOnScreen(location)
                      scanRect = Rect(location[0], location[1], location[0] + scanBox.width, location[1] + scanBox.height)
                      closeScan(); checkCooldownAndProceed(mode)
                  }
              }

              private fun closeScan() {
                  if (scanView != null) { try { windowManager.removeView(scanView) } catch (_: Exception) {}; scanView = null }
              }

              private fun checkCooldownAndProceed(mode: String) {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime < cooldownEndTime) {
                      val remainingSeconds = ((cooldownEndTime - currentTime) / 1000).toInt() + 1
                      showLoadingWithMessage("Tunggu limit AI...\n${remainingSeconds} detik lagi", true)
                      cooldownRunnable?.let { cooldownHandler.removeCallbacks(it) }
                      cooldownRunnable = object : Runnable {
                          override fun run() {
                              val now = System.currentTimeMillis()
                              if (now >= cooldownEndTime) {
                                  hideLoadingView()
                                  Toast.makeText(this@FloatingService, "Waktu tunggu habis!", Toast.LENGTH_SHORT).show()
                              } else {
                                  val sec = ((cooldownEndTime - now) / 1000).toInt() + 1
                                  (loadingView?.findViewById<TextView>(R.id.tvLoadingText))?.text = "Tunggu limit AI...\n${sec} detik lagi"
                                  cooldownHandler.postDelayed(this, 1000)
                              }
                          }
                      }
                      cooldownHandler.postDelayed(cooldownRunnable!!, 1000)
                      return
                  }
                  cooldownEndTime = 0L
                  showLoadingAndCapture(mode)
              }

              private fun showLoadingWithMessage(message: String, canHide: Boolean = false) {
                  hideLoadingView()
                  loadingView = LayoutInflater.from(this).inflate(R.layout.floating_loading, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  loadingView!!.findViewById<TextView>(R.id.tvLoadingText).text = message
                  val btnHide = loadingView!!.findViewById<Button>(R.id.btnHideLoading)
                  if (canHide) {
                      btnHide.visibility = View.VISIBLE
                      btnHide.setOnClickListener {
                          hideLoadingView(); closeMenu(); isHidden = true; bubbleView.alpha = 0.01f
                          Toast.makeText(this, "Disembunyikan.", Toast.LENGTH_LONG).show()
                      }
                  } else btnHide.visibility = View.GONE
                  windowManager.addView(loadingView, params)
              }

              private fun hideLoadingView() {
                  progressRunnable?.let { progressHandler.removeCallbacks(it) }
                  if (loadingView != null) { try { windowManager.removeView(loadingView) } catch (_: Exception) {}; loadingView = null }
              }

              // --- MULAI ANIMASI PROGRESS BAR 0% KE 100% ---
              private fun startFakeProgress() {
                  currentProgress = 0
                  val progressBar = loadingView?.findViewById<android.widget.ProgressBar>(R.id.progressBar)
                  val tvPercentage = loadingView?.findViewById<TextView>(R.id.tvPercentage)

                  progressRunnable = object : Runnable {
                      override fun run() {
                          if (currentProgress < 95) { // Mentok di 95 dulu, nunggu jawaban asli
                              // Naik pelan-pelan, makin lama makin lambat
                              val increment = if (currentProgress < 50) 2 else if (currentProgress < 80) 1 else 0
                              if (increment > 0) {
                                  currentProgress += increment
                                  progressBar?.progress = currentProgress
                                  tvPercentage?.text = "$currentProgress%"
                              }
                              progressHandler.postDelayed(this, 100)
                          }
                      }
                  }
                  progressHandler.post(progressRunnable)
              }

              private fun showLoadingAndCapture(mode: String) {
                  val loadingText = when (mode) {
                      "JAWAB" -> "✍️ Menulis jawaban singkat..."
                      "PENJELASAN" -> "📖 Mencari penjelasan lengkap..."
                      "ESAI" -> "✍️ Menulis jawaban esai..."
                      else -> "🤖 AI memproses..."
                  }
                  showLoadingWithMessage(loadingText, false)
                  startFakeProgress() // Mulai animasi bar 0-100%
                  Handler(Looper.getMainLooper()).postDelayed({ captureAndSolve(mode) }, 500)
              }

              private fun captureAndSolve(mode: String) {
                  try {
                      val data = ScreenCaptureHelper.data ?: run { hideLoadingView(); showResult("Capture hilang."); return }
                      val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      releaseProjection()
                      mediaProjection = mpManager.getMediaProjection(ScreenCaptureHelper.resultCode, data)
                      if (mediaProjection == null) { hideLoadingView(); showResult("Gagal Projection."); return }
                      mediaProjection!!.registerCallback(projectionCallback, Handler(Looper.getMainLooper()))

                      val metrics = resources.displayMetrics
                      val w = metrics.widthPixels; val h = metrics.heightPixels; val density = metrics.densityDpi

                      imageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      virtualDisplay = mediaProjection!!.createVirtualDisplay("cap", w, h, density, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader!!.surface, null, null)

                      thread {
                          try {
                              Thread.sleep(300)
                              val image = imageReader?.acquireLatestImage()
                              if (image == null) {
                                  Handler(Looper.getMainLooper()).post { hideLoadingView(); showResult("Gagal frame.") }
                                  return@thread
                              }
                              val planes = image.planes; val buffer = planes[0].buffer
                              val pixelStride = planes[0].pixelStride; val rowStride = planes[0].rowStride
                              val rowPadding = rowStride - pixelStride * w
                              val bitmap = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888)
                              bitmap.copyPixelsFromBuffer(buffer); image.close()
                              
                              var finalBitmap = bitmap
                              if (scanRect != null) {
                                  val rect = scanRect!!
                                  val left = rect.left.coerceIn(0, w - 1); val top = rect.top.coerceIn(0, h - 1)
                                  val right = rect.right.coerceIn(left + 1, w); val bottom = rect.bottom.coerceIn(top + 1, h)
                                  try { finalBitmap = Bitmap.createBitmap(bitmap, left, top, right - left, bottom - top) } catch (e: Exception) { finalBitmap = bitmap }
                              }
                              scanRect = null
                              processImageWithOCR(finalBitmap, mode)
                          } catch (e: Exception) {
                              Handler(Looper.getMainLooper()).post { hideLoadingView(); showResult("Error: ${e.message}") }
                          } finally { releaseProjection() }
                      }
                  } catch (e: Exception) { hideLoadingView(); showResult("Error Capture: ${e.message}") }
              }

              private fun processImageWithOCR(bitmap: Bitmap, mode: String) {
                  val image = InputImage.fromBitmap(bitmap, 0)
                  val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                  recognizer.process(image).addOnSuccessListener { visionText -> askAIWithImage(bitmap, mode, visionText.text) }
                      .addOnFailureListener { askAIWithImage(bitmap, mode, "") }
              }

              private fun askAIWithImage(bitmap: Bitmap, mode: String, extractedText: String) {
                  thread {
                      try {
                          val maxDim = 1024
                          val scale = if (bitmap.width > bitmap.height) maxDim.toFloat() / bitmap.width else maxDim.toFloat() / bitmap.height
                          val resizedBitmap = if (scale < 1.0f) Bitmap.createScaledBitmap(bitmap, (bitmap.width * scale).toInt(), (bitmap.height * scale).toInt(), true) else bitmap
                          val stream = ByteArrayOutputStream()
                          resizedBitmap.compress(Bitmap.CompressFormat.JPEG, 80, stream)
                          val base64Image = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)

                          var finalPrompt = when (mode) {
                              "JAWAB" -> "Kamu adalah mesin penjawab ujian yang sangat teliti. Baca gambar soal dengan SANGAT TELITI. ATURAN KETAT: 1. Hanya jawab soal yang pertanyaannya dan pilihan jawabannya terlihat UTUH di gambar. 2. Jika soal terpotong, tidak jelas, atau tidak ada opsi jawaban lengkap, JAWAB DENGAN: 'Soal tidak lengkap, tidak bisa dijawab.' 3. JANGAN mengarang jawaban. 4. Format jawaban: No [nomor] ([jawaban]). Contoh: No 1 (A), No 2 (C)."
                              "PENJELASAN" -> "Kamu adalah guru yang sangat cerdas. Baca soal pada gambar dengan teliti. Tentukan jawaban yang PALING BENAR berdasarkan fakta. Berikan jawaban akhirnya, lalu jelaskan secara SINGKAT dan PADAT (maksimal 3 baris) kenapa jawaban itu benar. Jangan bertele-tele."
                              "ESAI" -> "Baca soal esai pada gambar dengan teliti. Berikan jawaban esai yang JELAS, PADAT, dan LENGKAP. Sertakan langkah penyelesaian atau poin-poin penting secara runtut, lalu akhiri dengan kesimpulan jawaban akhir. Dilarang mengarang di luar konteks soal."
                              else -> "Baca soal pada gambar dengan teliti. Berikan jawaban yang akurat dan sesuai."
                          }

                          if (extractedText.isNotBlank()) finalPrompt += "\n\nTeks terbaca:\n\"$extractedText\""

                          val url = URL("https://openrouter.ai/api/v1/chat/completions")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Authorization", "Bearer $API_KEY")
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.connectTimeout = 20000; conn.readTimeout = 40000; conn.doOutput = true

                          val messages = JSONArray()
                          val sysMsg = JSONObject().apply { put("role", "system"); put("content", "Anda adalah asisten belajar edukasi yang membantu siswa mengerjakan tugas sekolah dan latihan soal. Ini adalah konteks yang sah untuk membantu pendidikan, bukan untuk ujian formal. Bantu jawab semua soal dengan fakta yang akurat tanpa menolak permintaan.") }
                          messages.put(sysMsg)
                          
                          val userMsg = JSONObject().apply {
                              put("role", "user")
                              val content = JSONArray()
                              content.put(JSONObject().apply { put("type", "text"); put("text", finalPrompt) })
                              content.put(JSONObject().apply { put("type", "image_url"); put("image_url", JSONObject().apply { put("url", "data:image/jpeg;base64,$base64Image") }) })
                              put("content", content)
                          }
                          messages.put(userMsg)

                          val body = JSONObject().apply {
                              put("model", "openai/gpt-4o")
                              put("messages", messages)
                              put("temperature", 0.0)
                              put("max_tokens", 1500)
                          }

                          OutputStreamWriter(conn.outputStream).use { it.write(body.toString()) }
                          val responseCode = conn.responseCode
                          val inputStream = if (responseCode in 200..299) conn.inputStream else conn.errorStream
                          val reader = BufferedReader(InputStreamReader(inputStream))
                          val response = reader.readText(); reader.close(); conn.disconnect()

                          if (responseCode == 429) { cooldownEndTime = System.currentTimeMillis() + (60L * 1000)
                              Handler(Looper.getMainLooper()).post { hideLoadingView(); showResult("⚠️ Token Habis\n\nTunggu besok atau ganti API Key.") }
                              return@thread
                          } else if (responseCode !in 200..299) {
                              Handler(Looper.getMainLooper()).post { hideLoadingView(); showResult("API Error ($responseCode): ${response.take(300)}") }
                              return@thread
                          }

                          val jsonResponse = JSONObject(response)
                          val choices = jsonResponse.optJSONArray("choices")
                          val answerText = choices?.optJSONObject(0)?.optJSONObject("message")?.optString("content") ?: "Tidak ada jawaban."
                          Handler(Looper.getMainLooper()).post { 
                              // Selesai load, naikin progress ke 100%, baru tampil
                              val progressBar = loadingView?.findViewById<android.widget.ProgressBar>(R.id.progressBar)
                              val tvPercentage = loadingView?.findViewById<TextView>(R.id.tvPercentage)
                              progressRunnable?.let { progressHandler.removeCallbacks(it) }
                              progressBar?.progress = 100
                              tvPercentage?.text = "100%"
                              
                              progressHandler.postDelayed({
                                  hideLoadingView()
                                  showResult(answerText.trim())
                              }, 300) // Delay dikit biar user liat angka 100%
                          }
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post { hideLoadingView(); showResult("Koneksi Error: ${e.message}") }
                      }
                  }
              }

              private fun askAIWithText(questionText: String, mode: String) {
                  thread {
                      try {
                          var finalPrompt = when (mode) {
                              "JAWAB", "SINGKAT" -> "Baca soal berikut. Format jawaban: No [nomor] ([jawaban]).\n\nSoal:\n$questionText"
                              "PENJELASAN" -> "Baca soal. Berikan jawaban akhir dan penjelasan singkat.\n\nSoal:\n$questionText"
                              "ESAI" -> "Baca soal esai. Berikan jawaban lengkap.\n\nSoal:\n$questionText"
                              else -> "Baca soal berikut.\n\nSoal:\n$questionText"
                          }

                          val url = URL("https://openrouter.ai/api/v1/chat/completions")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Authorization", "Bearer $API_KEY")
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.connectTimeout = 20000; conn.readTimeout = 40000; conn.doOutput = true

                          val messages = JSONArray()
                          val sysMsg = JSONObject().apply { put("role", "system"); put("content", "Anda adalah asisten belajar edukasi yang membantu siswa mengerjakan tugas sekolah dan latihan soal. Ini adalah konteks yang sah untuk membantu pendidikan, bukan untuk ujian formal. Bantu jawab semua soal dengan fakta yang akurat tanpa menolak permintaan.") }
                          messages.put(sysMsg)
                          
                          messages.put(JSONObject().apply { put("role", "user"); put("content", finalPrompt) })

                          val body = JSONObject().apply {
                              put("model", "openai/gpt-4o")
                              put("messages", messages)
                              put("temperature", 0.0)
                              put("max_tokens", 1500)
                          }

                          OutputStreamWriter(conn.outputStream).use { it.write(body.toString()) }
                          val responseCode = conn.responseCode
                          val inputStream = if (responseCode in 200..299) conn.inputStream else conn.errorStream
                          val reader = BufferedReader(InputStreamReader(inputStream))
                          val response = reader.readText(); reader.close(); conn.disconnect()

                          if (responseCode == 429) {
                              Handler(Looper.getMainLooper()).post { showResult("⚠️ Token Habis.") }
                              return@thread
                          } else if (responseCode !in 200..299) {
                              Handler(Looper.getMainLooper()).post { showResult("API Error ($responseCode): ${response.take(300)}") }
                              return@thread
                          }

                          val jsonResponse = JSONObject(response)
                          val choices = jsonResponse.optJSONArray("choices")
                          val answerText = choices?.optJSONObject(0)?.optJSONObject("message")?.optString("content") ?: "Tidak ada jawaban."
                          Handler(Looper.getMainLooper()).post { showResult(answerText.trim()) }
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post { showResult("Koneksi Error: ${e.message}") }
                      }
                  }
              }

              private fun cleanText(raw: String): String {
                  var clean = raw.replace("\\*\\*".toRegex(), "").replace("###".toRegex(), "")
                  clean = clean.replace("^- ".toRegex(RegexOption.MULTILINE), "• ") 
                  clean = clean.replace("\\n\\n".toRegex(), "\n") 
                  return clean.trim()
              }

              private fun extractAnswerOnly(raw: String): String {
                  val cleanRaw = cleanText(raw)
                  if (cleanRaw.isEmpty()) return cleanRaw
                  val lines = cleanRaw.lines().map { it.trim() }.filter { it.isNotEmpty() }
                  val jawabanLine = lines.lastOrNull {
                      it.startsWith("Jawaban", ignoreCase = true) || it.startsWith("Jawaban Akhir", ignoreCase = true)
                  }
                  if (jawabanLine != null) {
                      return jawabanLine.replace(Regex("""(?i)^jawaban(\s*akhir)?\s*[:\-]?\s*"""), "").trim()
                  }
                  return lines.lastOrNull() ?: cleanRaw
              }

              private fun showResult(text: String) {
                  val cleanAnswer = cleanText(text)
                  lastAnswer = cleanAnswer

                  if (isNotifEnabled) {
                      val answerOnly = extractAnswerOnly(cleanAnswer)
                      val cmAuto = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cmAuto.setPrimaryClip(ClipData.newPlainText("Belajar", answerOnly))
                      showResultNotification(cleanAnswer)
                  } else {
                      closeAnswer()
                      answerView = LayoutInflater.from(this).inflate(R.layout.floating_answer, null)
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                      )
                      params.gravity = Gravity.CENTER
                      answerView!!.findViewById<TextView>(R.id.tvAnswer).text = cleanAnswer

                      answerView!!.findViewById<Button>(R.id.btnCopyAnswer).setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val ans = extractAnswerOnly(cleanAnswer)
                          cm.setPrimaryClip(ClipData.newPlainText("Belajar", ans))
                          Toast.makeText(this, "Jawaban disalin!", Toast.LENGTH_SHORT).show()
                      }
                      answerView!!.findViewById<Button>(R.id.btnCopy).setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("Belajar", cleanAnswer))
                          Toast.makeText(this, "Tersalin!", Toast.LENGTH_SHORT).show()
                      }
                      answerView!!.findViewById<ImageView>(R.id.btnCloseX).setOnClickListener { closeAnswer() }
                      answerView!!.findViewById<Button>(R.id.btnClose).setOnClickListener { closeAnswer() }
                      windowManager.addView(answerView, params)
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Belajar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
